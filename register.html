<body>
    <form action="userData" method="post">

        <legend><h1>Enter Details</h1></legend> <br>
        <table cellpadding="10px">

                <td><label for="name">Name</label></td>
                <td><input type="text" id="name" name="name" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td><label for="name">Phone Number</label></td>
                <td><input type="number" id="name" name="phone" placeholder="Enter your phone number"></td>
            </tr>
            <tr>

        <button type="submit">REGISTER</button>

    </form>
